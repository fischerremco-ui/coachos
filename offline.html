<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#c8102e">
    <title>CoachOS — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
        color: #fff;
        background: #071b34;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 30px;
        background: #0d294d;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      }
      img {
        width: 76px;
        height: 76px;
        margin-bottom: 22px;
        border-radius: 18px;
      }
      h1 { margin: 0 0 10px; font-size: 2rem; letter-spacing: -0.04em; }
      p { margin: 0 0 24px; color: rgba(255, 255, 255, 0.7); line-height: 1.55; }
      a {
        display: grid;
        min-height: 56px;
        place-items: center;
        color: #fff;
        background: #c8102e;
        border-radius: 14px;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="">
      <h1>Je bent offline</h1>
      <p>
        CoachOS kon dit scherm niet laden. Eerder geopende trainingen,
        reflecties en concepten blijven lokaal beschikbaar.
      </p>
      <a href="./">CoachOS opnieuw openen</a>
    </main>
  </body>
</html>
